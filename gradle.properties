org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk
org.gradle.parallel=true
org.gradle.caching=true

# 禁用 daemon。本容器是 PRoot，java.io.File.delete() 删目录恒失败，必须靠
# LD_PRELOAD=/opt/android-sdk/lib/libdelfix.so 垫片。但 daemon 是常驻进程，
# LD_PRELOAD 只对「启动它的那一次调用」生效；一旦某次没带垫片启动了 daemon，
# 后续所有构建都会复用它，mergeJavaResource 阶段报
# "Failed to delete '/tmp/tempdir_...'" 并且每次失败还残留 66 个空目录。
# 关掉 daemon 后每次构建都是新进程，必定继承垫片，代价只是多几秒 JVM 启动。
org.gradle.daemon=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# Google 只发布 x86_64 的 aapt2，本机为 aarch64，改用静态编译的 aarch64 版本
android.aapt2FromMavenOverride=/root/android/sdk/build-tools/35.0.0/aapt2
